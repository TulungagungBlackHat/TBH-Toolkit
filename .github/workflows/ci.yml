name: CI
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Compile manager
        run: python3 -m py_compile tbh
      - name: Manager self-test
        run: |
          python3 tbh version
          python3 tbh list --json
          python3 tbh doctor || true
      - name: Lint installer
        run: bash -n install.sh
