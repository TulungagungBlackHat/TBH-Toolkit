name: CI
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Compile everything
        run: python3 -m py_compile tbh modules/*.py
      - name: Dispatcher smoke
        run: |
          python3 tbh version
          python3 tbh list
          python3 tbh doctor
          python3 tbh ui --selftest
          python3 tbh config
          python3 tbh findings
      - name: Every tool --help
        run: |
          for c in recon subfinder dirfinder paramfinder jsleak xss sqli lfi ssrf ssti \
                   redirect idor cors portscan phish passstrength utils web; do
            echo "== tbh $c =="
            python3 tbh "$c" --help >/dev/null
          done
      - name: Lint installer
        run: bash -n install.sh
