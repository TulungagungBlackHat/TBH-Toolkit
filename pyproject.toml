[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tbh-security-toolkit"
version = "1.0.0"
description = "Authorized Security Toolkit - defensive security, vulnerability assessment, lab testing (Tulungagung Black Hat)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tulungagung Black Hat" }]
dependencies = ["requests>=2.31"]
keywords = ["security", "bug-bounty", "defensive", "vulnerability", "osint", "lab"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4", "mypy>=1.10"]
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
toolkit = "toolkit.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["toolkit"]
branch = true
